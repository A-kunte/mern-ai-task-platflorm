# 1. Non-sensitive config (ConfigMap)
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ai-task-platform
data:
  MONGO_URI: "mongodb://mongodb-service:27017/taskdb"
  REDIS_HOST: "redis-service"

---
# 2. Sensitive info (Secret)
# Note: In real production, you'd use a tool like SealedSecrets or HashiCorp Vault.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ai-task-platform
type: Opaque
stringData:
  # Base64 encoding is automatic with stringData
  JWT_SECRET: "your-super-secret-key-change-me"